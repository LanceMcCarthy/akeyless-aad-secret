name: 'Akeyless AAD Dynamic Secret'
description: 'This action conveniently combines multiple steps to fetch only the information you need from the Azure AD dynamic secret.'
author: 'Lance McCarthy'
branding:
  icon: 'unlock'
  color: 'green'
inputs:
  akeyless-secret-path:
    description: 'The location of the secret in your AAD secret in the Akeyless vault (ex. /path-to/my-secret)'
    required: true
    default: ''
  akeyless-access-id:
    description: 'the Akeyless access ID (ex. p-123456, found in Users & Auth Methods portal)'
    required: true
    default: ''
  akeyless-access-key:
    description: 'The API access key, visit https://docs.akeyless.io/docs/api-key for more info.'
    required: true
    default: ''
  vault-url:
    description: 'This value overrides the default vault root URL.'
    required: false
    default: 'https://api.akeyless.io'
outputs:
  app-id:
    description: "The value of secret.appId from the AAD dynamic secret."
    value: ${{ steps.bundle.outputs.app-id }}
  tenant-id:
    description: "The value of secret.tenantId from the AAD dynamic secret."
    value: ${{ steps.bundle.outputs.tenant-id }}
  secret-text:
    description: "The value of secret.secretText from the AAD dynamic secret."
    value: ${{ steps.bundle.outputs.secret-text }}
  key-id:
    description: "The value of secret.keyId from the AAD dynamic secret."
    value: ${{ steps.bundle.outputs.key-id }}
  display-name:
    description: "The value of secret.displayName from the AAD dynamic secret."
    value: ${{ steps.bundle.outputs.display-name }}
runs:
  using: "composite"
  steps:
    - id: bundle
      shell: pwsh
      env:
        AKEYLESS_SECRET_PATH: ${{ inputs.akeyless-secret-path }}
        AKEYLESS_ACCESS_ID: ${{ inputs.akeyless-access-id }}
        AKEYLESS_ACCESS_KEY: ${{ inputs.akeyless-access-key }}
        VAULT_URL: ${{ inputs.vault-url }}
      run: |
        # **** INPUTS **** #

        $akeylessSecretPath = $env:AKEYLESS_SECRET_PATH
        $akeylessAccessId = $env:AKEYLESS_ACCESS_ID
        $akeylessAccessKey = $env:AKEYLESS_ACCESS_KEY
        $vaultUrl = $env:VAULT_URL

        if ([string]::IsNullOrWhiteSpace($akeylessSecretPath)) {
          throw "Input 'akeyless-secret-path' is required. For example, /path-to/my-secret."
        }
        
        if ([string]::IsNullOrWhiteSpace($akeylessAccessId)) {
          throw "Input 'akeyless-access-id' is required. See https://docs.akeyless.io/docs/api-key for more information."
        }

        if ([string]::IsNullOrWhiteSpace($akeylessAccessKey)) {
          throw "Input 'akeyless-access-key' is required. See https://docs.akeyless.io/docs/api-key for more information."
        }

        $parsedVaultUri = $null
        if (-not [Uri]::TryCreate($vaultUrl, [UriKind]::Absolute, [ref]$parsedVaultUri) -or $parsedVaultUri.Scheme -ne 'https') {
          throw "Input 'vault-url' must be an absolute HTTPS URL."
        }

        $vaultUrl = $parsedVaultUri.AbsoluteUri.TrimEnd('/')

        # **** OPERATIONS **** #

        $authBody = @{
          "access-id" = $akeylessAccessId
          "access-key" = $akeylessAccessKey
          "access-type" = "access_key"
        }

        $authParameters = @{
          Method = "POST"
          Uri =  "$vaultUrl/auth"
          Body = ($authBody | ConvertTo-Json)
          ContentType = "application/json"
          ErrorAction = "Stop"
        }

        try {
          $authResponse = Invoke-RestMethod @authParameters
        }
        catch {
          if ($null -ne $_.Exception.Response.StatusCode) {
            throw "Akeyless authentication failed with HTTP status $([int]$_.Exception.Response.StatusCode)."
          }

          throw "Akeyless authentication failed: $($_.Exception.Message)"
        }

        $token = $authResponse.token
        if ([string]::IsNullOrWhiteSpace($token)) {
          throw "Akeyless authentication succeeded but returned no token."
        }

        $secretBody = @{
          "name" = $akeylessSecretPath
          "token" = $token
        }

        $secretParameters = @{
          Method = "POST"
          Uri =  "$vaultUrl/get-dynamic-secret-value"
          Body = ($secretBody | ConvertTo-Json)
          ContentType = "application/json"
          ErrorAction = "Stop"
        }

        try {
          $dynamicSecret = Invoke-RestMethod @secretParameters
        }
        catch {
          if ($null -ne $_.Exception.Response.StatusCode) {
            throw "Akeyless dynamic secret retrieval failed with HTTP status $([int]$_.Exception.Response.StatusCode)."
          }
          
          throw "Akeyless dynamic secret retrieval failed: $($_.Exception.Message)"
        }

        if ($null -eq $dynamicSecret.secret) {
          Write-Output "::error::Akeyless returned no dynamic secret."
          throw "Akeyless returned no dynamic secret."
        }

        $appId = $dynamicSecret.secret.appId
        $tenantId = $dynamicSecret.secret.tenantId
        $secretText = $dynamicSecret.secret.secretText
        $keyId = $dynamicSecret.secret.keyId
        $displayName = $dynamicSecret.secret.displayName

        $requiredOutputs = @{
          "app-id" = $appId
          "tenant-id" = $tenantId
          "secret-text" = $secretText
          "key-id" = $keyId
          "display-name" = $displayName
        }

        foreach ($output in $requiredOutputs.GetEnumerator()) {
          if ([string]::IsNullOrWhiteSpace($output.Value)) {
            Write-Output "::warning::Akeyless returned an empty '$($output.Key)' value."
          }
        }

        # **** OUTPUTS **** #

        echo "app-id=$appId" >> $env:GITHUB_OUTPUT
        echo "tenant-id=$tenantId" >> $env:GITHUB_OUTPUT
        echo "secret-text=$secretText" >> $env:GITHUB_OUTPUT
        echo "key-id=$keyId" >> $env:GITHUB_OUTPUT
        echo "display-name=$displayName" >> $env:GITHUB_OUTPUT